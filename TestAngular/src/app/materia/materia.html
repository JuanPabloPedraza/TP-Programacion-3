<section class="materia-panel">
  <div class="materia-toolbar">
    <mat-form-field appearance="outline">
      <mat-label>Filtrar materias</mat-label>
      <input matInput [(ngModel)]="search" (keyup.enter)="buscar()" placeholder="Nombre">
    </mat-form-field>
    <button mat-stroked-button type="button" (click)="buscar()">Buscar</button>
    @if (canManage) {
      <button class="new-materia-button" mat-raised-button color="primary" (click)="agregarMateria()">Nueva materia</button>
    }
  </div>

  <table mat-table [dataSource]="materias" class="materia-table mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let materia">{{ materia.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let materia">{{ materia.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="cantidadAlumnos">
      <th mat-header-cell *matHeaderCellDef>Alumnos</th>
      <td mat-cell *matCellDef="let materia">{{ materia.cantidadAlumnos }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let materia">
        <button mat-button color="primary" (click)="editarMateria(materia)">Editar</button>
        @if (canDelete) {
          <button mat-button color="warn" (click)="eliminar(materia)">Eliminar</button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator
    class="materia-paginator"
    [length]="totalCount"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="cambiarPagina($event)"
    showFirstLastButtons>
  </mat-paginator>
</section>
