<mat-card class="users-card">
  <mat-card-header>
    <mat-card-title>Usuarios y autorización por roles</mat-card-title>
    <mat-card-subtitle>Solo un administrador puede acceder y modificar permisos.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="users-toolbar">
      <mat-form-field appearance="outline">
        <mat-label>Filtrar usuarios</mat-label>
        <input matInput [(ngModel)]="search" (keyup.enter)="buscar()" placeholder="Nombre o email">
      </mat-form-field>
      <button mat-stroked-button type="button" (click)="buscar()">Buscar</button>
    </div>

    <table mat-table [dataSource]="usuarios" class="mat-elevation-z2">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let usuario">{{ usuario.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let usuario">{{ usuario.email }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let usuario">
          <mat-form-field appearance="outline" class="role-field">
            <mat-select
              [value]="usuario.rol"
              [disabled]="usuario.id === currentUserId"
              (selectionChange)="cambiarRol(usuario, $event.value)">
              @for (rol of roles; track rol) {
                <mat-option [value]="rol">{{ rol }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let usuario">
          <button
            mat-button
            color="warn"
            [disabled]="usuario.id === currentUserId"
            (click)="eliminar(usuario)">
            Eliminar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [length]="totalCount"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="cambiarPagina($event)"
      showFirstLastButtons>
    </mat-paginator>
  </mat-card-content>
</mat-card>
