 <h2 mat-dialog-title>{{ data.materia ? 'Editar materia' : 'Nueva materia' }}</h2>

    <mat-dialog-content class="dialog-content">

      <mat-form-field appearance="outline" class="full-width-field">
        <mat-label>Nombre</mat-label>
        <input
          matInput
          [(ngModel)]="nombre"
          #nombreModel="ngModel"
          placeholder="Nombre"
          required
          maxlength="25">
        <mat-hint align="end">{{ nombre.length }}/25</mat-hint>
        <mat-error *ngIf="nombreModel.invalid && nombreModel.touched">
          El nombre es obligatorio.
        </mat-error>
        <mat-error *ngIf="nombreLimpio.length > maxNombreLength">
          El nombre no puede superar los 25 caracteres.
        </mat-error>
        <mat-error *ngIf="nombreDuplicado">
          Ya existe una materia con ese nombre.
        </mat-error>
      </mat-form-field>

    </mat-dialog-content>

    <mat-dialog-actions align="end">

      <button mat-button (click)="cancelar()">Cancelar</button>

      <button mat-raised-button color="primary" (click)="confirmar()" [disabled]="nombreInvalido">
        {{ data.materia ? 'Guardar' : 'Agregar' }}
      </button>

    </mat-dialog-actions>
